# Run from the repository root:
#   docker compose -f server/docker-compose.yml up -d --build
services:
  legion-draft:
    build:
      context: ..
      dockerfile: server/Dockerfile
    image: autobat-legions-server
    container_name: legion-draft-server
    restart: unless-stopped
    # Lets you type admin commands: `docker attach legion-draft-server`
    # (detach again with Ctrl+P then Ctrl+Q; Ctrl+C would stop the server).
    stdin_open: true
    tty: true
    ports:
      - "24702:24702/udp"
    environment:
      - PORT=24702
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
